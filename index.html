<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 등급 미리보기 | 대교 다산지점 수학 1분 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --ink:#1d1d1f; --gray:#6e6e73; --soft:#86868b; --line:#d2d2d7; --nav:#1d1d1f;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;letter-spacing:-.02em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
button,a{font:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid #0071e3;outline-offset:3px}
.screen{display:none;min-height:100vh;max-width:520px;margin:0 auto;background:var(--bg)}
.screen.on{display:block}
@media (prefers-reduced-motion:no-preference){.screen.on{animation:fade .35s ease}@keyframes fade{from{opacity:0}to{opacity:1}}}

.bar{display:flex;justify-content:center;align-items:center;padding:11px 22px;background:var(--nav)}
.bar img{height:34px;width:auto;display:block}

/* 1 학년 선택 */
.notice{background:var(--surface);color:var(--ink);font-size:.8rem;text-align:center;padding:12px 22px}
.hero{padding:52px 24px 30px}
.hero h1{font-size:2.6rem;font-weight:900;line-height:1.15;letter-spacing:-.05em;margin:0 0 14px;word-break:keep-all}
.hero .sub{font-size:1.3rem;font-weight:700;margin:0 0 8px;letter-spacing:-.035em}
.hero .sub span{color:var(--soft)}
.hero .desc{font-size:.95rem;color:var(--gray);margin:0;line-height:1.6}
.pick{padding:0 20px 56px}
.pick h2{font-size:1.45rem;font-weight:900;letter-spacing:-.04em;margin:0 4px 16px}
.pick h2 span{color:var(--soft)}
.grades{display:flex;flex-direction:column;gap:10px}
.grade{display:block;width:100%;border:0;background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;cursor:pointer;text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s}
.grade b{font-size:1.3rem;font-weight:900;letter-spacing:-.04em}
.grade:hover{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.grade:active{transform:scale(.98);background:var(--ink);color:#fff}

/* 2 문제 */
.q{padding:24px 20px 44px}
.q .meta{display:flex;justify-content:space-between;align-items:center;margin:0 4px 6px;font-size:.88rem;color:var(--gray);font-weight:500}
.q .back{background:none;border:0;color:var(--gray);padding:0;cursor:pointer;font-size:.88rem}
.q h2{font-size:1.75rem;font-weight:900;line-height:1.25;letter-spacing:-.045em;margin:0 4px 12px;word-break:keep-all}
.q .text{font-size:1rem;line-height:1.65;margin:0 4px 16px;word-break:keep-all}
.fig{background:var(--surface);border-radius:24px;padding:22px 14px;display:flex;justify-content:center;margin-bottom:16px;overflow-x:auto}
.fig svg{width:100%;height:auto;display:block}
.fig .w300{max-width:300px}.fig .w340{max-width:340px}.fig .w240{max-width:240px}
svg text{font-family:"Noto Sans KR",sans-serif;fill:#1d1d1f}
table.rps{border-collapse:collapse;width:100%;max-width:340px;font-size:.95rem;text-align:center;background:#fff}
table.rps caption{font-weight:700;margin-bottom:8px}
table.rps th,table.rps td{border:1px solid #1d1d1f;padding:8px 4px}
table.rps thead th{background:#d2d2d7}
table.rps tbody th{background:#e8e8ed;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:16px;padding:18px 8px;background:var(--surface);color:var(--ink);font-size:1.05rem;font-weight:700;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff}
.check{display:block;width:100%;margin-top:20px;border:0;border-radius:999px;padding:17px;background:var(--ink);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
.check[disabled]{opacity:.25;cursor:default}

/* 3 결과 */
.verdict{padding:44px 24px 0}
.verdict h2{font-size:2.5rem;font-weight:900;letter-spacing:-.05em;line-height:1.2;margin:0 0 6px}
.verdict p{margin:0;color:var(--gray);font-size:1.05rem}
.compare{margin:28px 20px 0;padding:28px 24px 30px;background:#000;color:#f5f5f7;border-radius:24px}
.compare .lab{margin:0 0 6px;color:#a1a1a6;font-size:.95rem;font-weight:500}
.big{font-weight:900;line-height:1;letter-spacing:-.06em;margin:0;font-size:6.5rem;
  background:linear-gradient(90deg,#ffffff,#5a5a5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.compare .ask{margin:8px 0 0;font-size:1.6rem;font-weight:700;letter-spacing:-.04em}
.claim{padding:36px 24px 32px;margin:0;font-size:1.95rem;font-weight:900;line-height:1.3;letter-spacing:-.05em;word-break:keep-all}
.claim span{display:block}
.claim .g2{color:var(--soft)}
.contact{padding:0 20px}
.call{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--ink);color:#fff;text-decoration:none;border-radius:22px;padding:24px 16px;font-size:1.35rem;font-weight:900;letter-spacing:-.03em;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.call svg{width:28px;height:28px;flex:none}
.call:active{transform:scale(.98)}
.contact .note{margin:12px 0 0;text-align:center;font-size:.8rem;color:var(--gray)}
.after{display:flex;justify-content:center;gap:28px;padding:24px 20px 44px}
.after button{background:none;border:0;color:var(--gray);font-size:.95rem;cursor:pointer;padding:4px}
</style>
</head>

  t+='<text x="'+x0+'" y="'+(y0+36)+'">오전</text><text x="'+(x0+5.5*st)+'" y="'+(y0+36)+'">오후</text><text x="'+(x0+11*st)+'" y="'+(y0+36)+'">(시)</text><text x="6" y="'+(y0-11*ys-12)+'" text-anchor="start">(mm)</text></g>';
  var p=[[0,0],[2,2],[4,7],[7,7],[10,9],[11,10]].map(function(a){return (x0+a[0]*st)+' '+(y0-a[1]*ys)}).join(' L');
  Q[4].fig='<svg class="w340" viewBox="0 0 310 310" role="img" aria-label="오전 7시 0mm, 9시 2mm, 11시 7mm, 오후 2시 7mm, 5시 9mm, 6시 10mm인 꺾은선그래프"><text x="'+(x0+5.5*st)+'" y="22" font-size="15" font-weight="700" text-anchor="middle">물의 높이</text>'+s+'<path d="M'+p+'" stroke="#1d1d1f" stroke-width="2.6" fill="none" stroke-linejoin="round"/>'+t+'</svg>';
})();

/* 5학년 전개도 + 쌓은 정육면체 */
(function(){
  var c=36,ox=8,oy=40,net=[[0,0,5],[1,0,4],[1,1,3],[2,1,7],[2,2,8],[3,2,6]],s='';
  net.forEach(function(n){var x=ox+n[0]*c,y=oy+n[1]*c;s+='<rect x="'+x+'" y="'+y+'" width="'+c+'" height="'+c+'" fill="#dcdce1" stroke="#1d1d1f" stroke-width="1.6"/><text x="'+(x+c/2)+'" y="'+(y+c/2+7)+'" font-size="19" text-anchor="middle">'+n[2]+'</text>';});
  var a=46,X=200,Y=60,d=18,front=[[5,7],[7,6]],cube='';
  for(var col=0;col<2;col++){var x=X+col*a;cube+='<polygon points="'+x+','+Y+' '+(x+a)+','+Y+' '+(x+a+d)+','+(Y-d)+' '+(x+d)+','+(Y-d)+'" fill="#ececf0" stroke="#1d1d1f" stroke-width="1.6"/><text x="'+(x+a/2+d/2)+'" y="'+(Y-d/2+6)+'" font-size="16" text-anchor="middle">4</text>';}
  var side=[6,4];
  for(var r=0;r<2;r++){var y=Y+r*a,xr=X+2*a;cube+='<polygon points="'+xr+','+y+' '+(xr+d)+','+(y-d)+' '+(xr+d)+','+(y+a-d)+' '+xr+','+(y+a)+'" fill="#c7c7cc" stroke="#1d1d1f" stroke-width="1.6"/><text x="'+(xr+d/2)+'" y="'+(y+a/2-d/2+6)+'" font-size="16" text-anchor="middle">'+side[r]+'</text>';
    for(col=0;col<2;col++){var x2=X+col*a;cube+='<rect x="'+x2+'" y="'+y+'" width="'+a+'" height="'+a+'" fill="#dcdce1" stroke="#1d1d1f" stroke-width="1.6"/><text x="'+(x2+a/2)+'" y="'+(y+a/2+7)+'" font-size="20" text-anchor="middle">'+front[r][col]+'</text>';}}
  Q[5].fig='<svg class="w340" viewBox="0 0 340 170" role="img" aria-label="㈎ 전개도: 5와 4, 그 아래 3과 7, 그 아래 8과 6이 계단 모양. ㈏ 정육면체 4개: 앞면 위 5, 7 아래 7, 6, 윗면 4, 4, 옆면 6, 4"><g font-size="16" font-weight="700"><text x="4" y="24">㈎</text><text x="186" y="24">㈏</text></g>'+s+cube+'</svg>';
})();

var S={start:document.getElementById("s-start"),quiz:document.getElementById("s-quiz"),result:document.getElementById("s-result")};
function show(k){for(var n in S)S[n].classList.toggle("on",n===k);window.scrollTo(0,0);}
var circ=["①","②","③","④"],g=null,picked=null,check=document.getElementById("check");

var gb=document.getElementById("grades");
for(var i=1;i<=6;i++){(function(n){var b=document.createElement("button");b.className="grade";b.innerHTML="<b>"+n+"학년</b>";b.addEventListener("click",function(){start(n);});gb.appendChild(b);})(i);}

function start(n){
  g=n;picked=null;var q=Q[n];
  document.getElementById("q-grade").textContent="초"+n+" 수학";
  document.getElementById("q-unit").textContent=q.unit;
  document.getElementById("q-text").textContent=q.text;
  document.getElementById("q-fig").innerHTML=q.fig;
  var box=document.getElementById("q-opts");box.innerHTML="";
  q.opts.forEach(function(o,idx){var b=document.createElement("button");b.className="opt";b.setAttribute("aria-pressed","false");b.textContent=circ[idx]+" "+o;
    b.addEventListener("click",function(){picked=idx;box.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});check.disabled=false;});box.appendChild(b);});
  check.disabled=true;show("quiz");
}
check.addEventListener("click",function(){
  if(picked===null)return;var q=Q[g],ok=picked===q.ans;
  document.getElementById("r-title").textContent=ok?"정답입니다.":"아쉽게 틀렸습니다.";
  document.getElementById("r-answer").textContent="정답은 "+circ[q.ans]+" "+q.opts[q.ans]+"입니다.";
  document.getElementById("r-lab").textContent=g+"학년 평균 정답률";
  document.getElementById("r-rate").textContent=q.rate+"%";
  document.getElementById("r-claim").innerHTML=ok
    ?'<span>이제 상위 10%로.</span><span>다음 단계는</span><span class="g2">눈높이와 시작하세요.</span>'
    :'<span>틀렸다면,</span><span>지금 바로.</span><span class="g2">눈높이로 잡아보세요.</span>';
  show("result");
});
document.getElementById("q-back").addEventListener("click",function(){show("start");});
document.getElementById("retry").addEventListener("click",function(){start(g);});
document.getElementById("other").addEventListener("click",function(){show("start");});
var h=(location.hash||"").replace("#","");if(/^g[1-6]$/.test(h))start(+h[1]);
})();
</script>
